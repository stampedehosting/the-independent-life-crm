name: independent-life-crm
region: nyc
services:
  - name: api
    github:
      repo: stampedehosting/the-independent-life-crm
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: MONGODB_URI
        value: ${db.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: TWILIO_ACCOUNT_SID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: TWILIO_PHONE_NUMBER
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SENDGRID_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SENDGRID_FROM_EMAIL
        scope: RUN_AND_BUILD_TIME
      - key: SENDGRID_FROM_NAME
        value: "The Independent Life CRM"
      - key: GOHIGHLEVEL_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: GOHIGHLEVEL_LOCATION_ID
        scope: RUN_AND_BUILD_TIME

databases:
  - name: db
    engine: MONGODB
    version: "6"
    production: true
    cluster_name: independent-life-crm-db
